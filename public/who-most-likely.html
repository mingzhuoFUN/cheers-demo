    .question-prep-art{border-radius:28px;background:radial-gradient(circle at 50% 42%,#fff8e8 0 34%,#f3dfbc 72%,transparent 73%)}
  </style>
</head>
<body>
<main class="phone">
  <section class="screen active count-screen" id="countSetup">
    <div class="topbar"><button class="icon-btn" aria-label="返回游戏大厅"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
    <header class="count-header"><h1>人数选择</h1><p>选择人数，完善玩家信息</p></header>
    <div class="count-picker" aria-label="选择游戏人数"><button class="count-button" data-count="2">2</button><button class="count-button" data-count="3">3</button><button class="count-button" data-count="4">4</button><button class="count-button" data-count="5">5</button><button class="count-button" data-count="6">6</button></div>
    <div class="setup-player-list" id="setupPlayerList"></div>
    <section class="warmth-setup"><h2>关系温度</h2><div class="warmth-labels"><span>慢慢认识</span><span>无话不谈</span></div><input class="warmth-range" id="warmthRange" aria-label="关系温度" type="range" min="0" max="100" value="58"></section>
    <section class="setup-roster"><header><h2>本桌玩家</h2><span id="rosterCount">4人</span></header><div class="roster-players" id="rosterPlayers"></div></section>
    <button class="primary" id="confirmCount">开始</button>
  </section>

  <section class="screen question-prep-screen" id="questionLoading" role="status" aria-live="polite">
    <div class="question-prep-art" aria-hidden="true"><img src="/game-assets/loading/most-likely-loading-v1.webp" alt=""></div>
    <span>正在根据本桌玩家准备</span>
    <h1>生成今晚的题目</h1>
    <div class="question-prep-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>

  <section class="screen" id="intro">
    <div class="topbar"><button class="icon-btn" data-go="countSetup" aria-label="返回人数选择"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
    <div class="hero"><div class="hero-art" role="img" aria-label="玩家们正在投票"><div class="hero-players" id="heroPlayers"></div><span class="hero-center" aria-hidden="true"></span></div><h1>谁最可能</h1></div>
    <div class="game-steps" aria-label="玩法：读题、选人、说理由"><div class="game-step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4M9 11h6M9 15h6"/></svg><span>读题</span></div><svg class="step-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><div class="game-step"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m9 12 2 2 4-5"/></svg><span>选人</span></div><svg class="step-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg><div class="game-step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"/><path d="M9 9h6M9 12h4"/></svg><span>说理由</span></div></div>
    <button class="primary" data-go="question">开始游戏</button>
    <button class="impression-ticket" id="openImpressionsIntro"><div class="ticket-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3-5 3z"/><path d="M10 9h4M10 12h4"/></svg></div><div><strong>今晚印象</strong><span>游戏中会留下大家眼中的你</span></div><svg class="ticket-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
  </section>

  <section class="screen" id="question">
    <div class="topbar"><button class="icon-btn" data-go="intro" aria-label="返回游戏介绍"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="top-actions"><button class="icon-btn" id="openImpressionsGame" aria-label="查看今晚印象"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3-5 3z"/><path d="M10 9h4M10 12h4"/></svg></button><span class="round-pill" id="roundLabel">第 1 题</span></div></div>
    <header class="question-head"><span class="eyebrow">谁最可能</span><h1 id="questionText">正在准备题目…</h1></header>
    <div class="vote-status"><span>点击头像投票</span><strong id="voteCount" role="status" aria-live="polite">已记录 0 / 4</strong></div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="player-grid" id="playerGrid"></div>
    <div class="vote-actions"><button class="secondary" id="undo" disabled>撤销</button><button class="primary reveal" id="nextRound" disabled>还差 4 票</button></div>
  </section>

  <section class="screen direction-screen" id="direction">
    <header class="direction-head"><span>下一阶段</span><h1>接下来想玩什么风格？</h1><p>只改变题目气氛，不会重复本局旧题</p></header>
    <div class="direction-options" id="directionOptions"></div>
    <p class="direction-note">选择后会准备一批新方向题目</p>
  </section>

  <section class="screen impressions-screen" id="impressions">
    <div class="topbar"><button class="icon-btn" id="closeImpressions" aria-label="返回上一页"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="round-pill">本局记录</span></div>
    <header class="impressions-header"><span class="eyebrow">大家眼中的你们</span><h1>今晚印象</h1><p>只记录每道题中获得最高票的玩家</p></header>
    <div class="impression-list" id="impressionList"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
  const seedPlayers=[{name:'小林',avatar:'a0',gender:'男'},{name:'小雨',avatar:'a1',gender:'女'},{name:'阿杰',avatar:'a2',gender:'男'},{name:'可可',avatar:'a3',gender:'女'},{name:'安安',avatar:'a4',gender:'女'},{name:'大宇',avatar:'a5',gender:'男'}];
  const pageParams=new URLSearchParams(location.search),sharedConfig=(()=>{try{return JSON.parse(sessionStorage.getItem('cheers-game-config')||'null')}catch{return null}})(),prefetchedQuestions=(()=>{try{const value=JSON.parse(sessionStorage.getItem('cheers-prefetched-most-likely')||'null');const key=JSON.stringify({promptVersion:'party-fun-v18',players:sharedConfig?.players?.map(({id,name,gender})=>({id,name:name.trim(),gender})),warmth:sharedConfig?.warmth});return value?.key===key?value.questions:null}catch{return null}})(),requestedCount=sharedConfig?.players?.length||Number(pageParams.get('players'))||4;document.body.classList.toggle('embedded',pageParams.get('embedded')==='1');
  if(sharedConfig?.players)sharedConfig.players.forEach((player,index)=>{if(seedPlayers[index])Object.assign(seedPlayers[index],{name:player.name,gender:player.gender,avatar:`a${player.avatar}`})});
  let selectedCount=Math.min(6,Math.max(2,requestedCount));
  let players=seedPlayers.slice(0,selectedCount);
  let questions=[];
  const questionHistoryKey='cheers-most-likely-question-history-v1';
  const readQuestionHistory=()=>{try{const value=JSON.parse(sessionStorage.getItem(questionHistoryKey)||'[]');return Array.isArray(value)?value.filter(text=>typeof text==='string').slice(-100):[]}catch{return[]}};
  const saveQuestionHistory=texts=>sessionStorage.setItem(questionHistoryKey,JSON.stringify(texts.slice(-100)));
  let votes=players.map(()=>0),history=[],impressions=players.map(()=>[]),round=0,impressionReturn='intro',questionRequest=0,usedQuestionTexts=readQuestionHistory(),activeQuestion=null,replenishing=null,activeDirection=null,roundsSinceDirection=0,directionPromptCount=0;
  const directionLibrary=[{id:'funny',label:'爆笑离谱'},{id:'flirty',label:'暧昧升温'},{id:'bold',label:'大胆坦白'},{id:'roast',label:'互损揭短'},{id:'absurd',label:'脑洞失控'},{id:'confessions',label:'酒后真话'},{id:'details',label:'细节侦探'},{id:'friendship',label:'损友默契'},{id:'crisis',label:'阵营危机'}];
  const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];
  function go(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));}
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  function avatar(index,extra=''){return `<div class="avatar ${players[index].avatar} ${extra}"></div>`}
  function renderCountSetup(){const visible=seedPlayers.slice(0,selectedCount);const setupList=$('#setupPlayerList');setupList.className=`setup-player-list count-${selectedCount}`;document.querySelectorAll('.count-button').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.count)===selectedCount)));setupList.innerHTML=visible.map((p,i)=>`<div class="setup-player-row"><div class="avatar ${p.avatar}" aria-hidden="true"></div><label class="name-field"><input value="${p.name}" maxlength="6" aria-label="玩家${i+1}昵称" data-name-index="${i}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4-1 10-10-3-3L5 16zM13 8l3 3"/></svg></label><div class="gender-switch" aria-label="${p.name}的性别"><button type="button" data-gender-index="${i}" data-gender="男" aria-pressed="${p.gender==='男'}">男</button><button type="button" data-gender-index="${i}" data-gender="女" aria-pressed="${p.gender==='女'}">女</button></div></div>`).join('');$('#rosterCount').textContent=`${selectedCount}人`;$('#rosterPlayers').innerHTML=visible.map(p=>`<div class="roster-player"><div class="avatar ${p.avatar}"></div><b>${p.name}</b></div>`).join('');document.querySelectorAll('[data-name-index]').forEach(input=>input.addEventListener('input',()=>{seedPlayers[Number(input.dataset.nameIndex)].name=input.value||`玩家${Number(input.dataset.nameIndex)+1}`;renderRosterOnly()}));document.querySelectorAll('[data-gender-index]').forEach(button=>button.addEventListener('click',()=>{seedPlayers[Number(button.dataset.genderIndex)].gender=button.dataset.gender;renderCountSetup()}))}
  function renderRosterOnly(){const visible=seedPlayers.slice(0,selectedCount);$('#rosterCount').textContent=`${selectedCount}人`;$('#rosterPlayers').innerHTML=visible.map(p=>`<div class="roster-player"><div class="avatar ${p.avatar}"></div><b>${p.name}</b></div>`).join('')}
  document.querySelectorAll('.count-button').forEach(button=>button.addEventListener('click',()=>{selectedCount=Number(button.dataset.count);renderCountSetup()}));
  const questionKey=text=>text.replace(/[\s，。！？、,.!?：:；;“”"']/g,'').toLowerCase();
  const questionCore=text=>text.replace(/^谁最[有不]可能/,'').replace(/(请说说|为什么|大家觉得|哪个细节|会是|可能会)/g,'').replace(/[\s，。！？、,.!?：:；;“”"']/g,'').toLowerCase();
  function similarQuestion(left,right){const a=questionCore(left),b=questionCore(right);if(a===b)return true;if(Math.min(a.length,b.length)>=8&&(a.includes(b)||b.includes(a)))return true;const grams=value=>new Set(Array.from({length:Math.max(0,value.length-1)},(_,i)=>value.slice(i,i+2))),ag=grams(a),bg=grams(b);if(!ag.size||!bg.size)return false;let overlap=0;ag.forEach(gram=>{if(bg.has(gram))overlap++});return overlap/Math.min(ag.size,bg.size)>=.56}
  function uniqueQuestionList(items,excluded=[]){const accepted=[...excluded];return items.filter(item=>{if(accepted.some(text=>similarQuestion(text,item.text)))return false;accepted.push(item.text);return true})}
  function shuffleQuestions(items){const copy=[...items];for(let index=copy.length-1;index>0;index--){const random=new Uint32Array(1);crypto.getRandomValues(random);const swap=random[0]%(index+1);[copy[index],copy[swap]]=[copy[swap],copy[index]]}return copy}
  async function loadQuestions(excludeTexts=[],replace=false,direction=activeDirection,requestedCount=16){const request=++questionRequest,previous=questions;if(!excludeTexts.length&&!direction&&requestedCount===16&&Array.isArray(prefetchedQuestions)&&prefetchedQuestions.length){questions=shuffleQuestions(uniqueQuestionList(prefetchedQuestions));return}try{const response=await fetch('/api/who-most-likely/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({players:players.map((p,id)=>({id:id+1,name:p.name.trim(),gender:p.gender})),warmth:Number($('#warmthRange').value),excludeTexts:excludeTexts.slice(-100),questionDirection:direction,requestedCount})});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(request===questionRequest&&Array.isArray(data.questions)&&data.questions.length){const fresh=shuffleQuestions(uniqueQuestionList(data.questions,[...usedQuestionTexts,...(replace?[]:questions.map(item=>item.text))]));questions=replace?fresh:[...questions,...fresh]}}catch(error){questions=previous;console.warn('题库生成失败',error)}}
  function nextUnusedQuestion(){const used=new Set(usedQuestionTexts.map(questionKey));return questions.find(item=>!used.has(questionKey(item.text)))}
  function replenishQuestions(){if(replenishing)return replenishing;replenishing=loadQuestions([...usedQuestionTexts,...questions.map(item=>item.text)].slice(-100),false,activeDirection,8).finally(()=>{replenishing=null});return replenishing}
  async function beginGame(){const button=$('#confirmCount');button.disabled=true;players=seedPlayers.slice(0,selectedCount);votes=players.map(()=>0);history=[];impressions=players.map(()=>[]);round=0;questions=[];usedQuestionTexts=readQuestionHistory();activeQuestion=null;activeDirection=null;roundsSinceDirection=0;directionPromptCount=0;$('#roundLabel').textContent='第 1 题';renderHeroPlayers();renderPlayers();renderImpressions();updateVoteUI();go('questionLoading');if(sharedConfig?.warmth!=null)$('#warmthRange').value=sharedConfig.warmth;await loadQuestions(usedQuestionTexts);activeQuestion=nextUnusedQuestion();if(!activeQuestion){$('#questionLoading span').textContent='题目暂时没有准备好';$('#questionLoading h1').textContent='请返回后重试';button.disabled=false;return}usedQuestionTexts.push(activeQuestion.text);saveQuestionHistory(usedQuestionTexts);$('#questionText').textContent=activeQuestion.text;button.disabled=false;go('intro');if(questions.length<10)replenishQuestions()}
  $('#confirmCount').addEventListener('click',beginGame);
  function renderHeroPlayers(){const host=$('#heroPlayers'),count=Math.min(6,Math.max(2,players.length));host.className=`hero-players count-${count}`;host.innerHTML=players.slice(0,count).map((p,i)=>`<span class="hero-player avatar ${p.avatar}" style="--angle:${-90+i*360/count}deg" aria-hidden="true"></span>`).join('')}
  function renderPlayers(){
    $('#playerGrid').className=`player-grid count-${players.length}`;
    $('#playerGrid').innerHTML=players.map((p,i)=>`<button class="player-card" data-player="${i}" aria-label="给${p.name}记一票">${avatar(i)}<b>${p.name}</b><span class="vote-badge ${votes[i]?'show':''}">+${votes[i]}</span></button>`).join('');
    document.querySelectorAll('.player-card').forEach(card=>card.addEventListener('click',()=>addVote(Number(card.dataset.player),card)));
  }
  function updateVoteUI(){const count=history.length,complete=count===players.length,max=complete?Math.max(...votes):-1,tied=complete&&votes.filter(v=>v===max).length>1;$('#voteCount').textContent=`已记录 ${count} / ${players.length}`;$('#progressBar').style.width=`${count/players.length*100}%`;$('#undo').disabled=!count;$('#nextRound').disabled=!complete;$('#nextRound').textContent=complete?'下一题':`还差 ${players.length-count} 票`;document.querySelectorAll('.player-card').forEach((card,i)=>{const badge=card.querySelector('.vote-badge');badge.textContent=`+${votes[i]}`;badge.classList.toggle('show',votes[i]>0);card.classList.toggle('highest',complete&&votes[i]===max);card.dataset.result=tied?'平票':'最高票'})}
  function addVote(index,card){if(history.length>=players.length){toast('票已经记满了');return}votes[index]++;history.push(index);card.classList.remove('bump');void card.offsetWidth;card.classList.add('bump');setTimeout(()=>card.classList.remove('bump'),170);updateVoteUI()}
  $('#undo').addEventListener('click',()=>{const last=history.pop();if(last===undefined)return;votes[last]--;updateVoteUI();toast(`已撤销给${players[last].name}的一票`)});
  async function advanceQuestion(){let next=nextUnusedQuestion();if(!next){go('questionLoading');await replenishQuestions();next=nextUnusedQuestion()}if(!next){go('question');toast('暂时没有新题目');return}activeQuestion=next;usedQuestionTexts.push(next.text);saveQuestionHistory(usedQuestionTexts);$('#roundLabel').textContent=`第 ${round+1} 题`;$('#questionText').textContent=next.text;renderPlayers();updateVoteUI();go('question');if(questions.filter(item=>!new Set(usedQuestionTexts.map(questionKey)).has(questionKey(item.text))).length<=6)replenishQuestions()}
  function openDirectionPicker(){const options=[...directionLibrary].sort(()=>Math.random()-.5).slice(0,3);$('#directionOptions').innerHTML=options.map((item,index)=>`<button type="button" class="direction-card" data-direction="${item.id}"><small>0${index+1}</small><strong>${item.label}</strong></button>`).join('')+`<button type="button" class="direction-card" data-direction=""><small>04</small><strong>保持原样</strong></button>`;document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>chooseDirection(button.dataset.direction||null)));go('direction')}
  async function chooseDirection(direction){directionPromptCount+=1;roundsSinceDirection=0;if(!direction){await advanceQuestion();return}activeDirection=direction;go('questionLoading');await loadQuestions(usedQuestionTexts,true,direction);await advanceQuestion()}
  $('#nextRound').addEventListener('click',async()=>{if(history.length!==players.length||!activeQuestion)return;const max=Math.max(...votes),tied=votes.filter(v=>v===max).length>1;votes.forEach((v,i)=>{if(v===max)impressions[i].push({tag:activeQuestion.tag,votes:v,total:players.length,tied,round:round+1})});round+=1;roundsSinceDirection+=1;votes=players.map(()=>0);history=[];renderPlayers();updateVoteUI();toast('本题已记录');const threshold=Math.max(10,players.length*3);if(directionPromptCount<2&&roundsSinceDirection>=threshold){openDirectionPicker();return}await advanceQuestion()});
  function renderImpressions(){$('#impressionList').innerHTML=players.map((p,i)=>{const items=impressions[i],shown=items.slice(-3).reverse();return `<article class="impression-card"><div class="impression-player">${avatar(i)}<strong>${p.name}</strong><span class="impression-count">${items.length} 条印象</span></div>${shown.length?`<div class="impression-tags">${shown.map(item=>`<span class="impression-tag">${item.tag} · <b>${item.votes}/${item.total}</b>${item.tied?' · 并列':''}</span>`).join('')}</div>`:'<p class="impression-empty">还没有留下印象，继续玩几题吧</p>'}</article>`}).join('')}
  function openImpressions(from){impressionReturn=from;renderImpressions();go('impressions')}
  $('#openImpressionsIntro').addEventListener('click',()=>openImpressions('intro'));
  $('#openImpressionsGame').addEventListener('click',()=>openImpressions('question'));
  $('#closeImpressions').addEventListener('click',()=>go(impressionReturn));
  function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),1500)}
  renderCountSetup();renderHeroPlayers();renderPlayers();renderImpressions();updateVoteUI();if(pageParams.get('autostart')==='1'&&sharedConfig)beginGame();
</script>
</body>
</html>
